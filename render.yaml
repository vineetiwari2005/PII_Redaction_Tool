services:
  - type: web
    name: pii-redaction-api
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: python -m uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SPACY_MODEL
        value: en_core_web_sm
      - key: PYTHON_VERSION
        value: "3.11.9"
